# Qwen3-0.6B-Base -- TTT-NTP release recipe.
# 100 steps x 64 x 32768 = 0.2B tokens (paper Table 5 budget). 28-layer backbone -> every 4th layer.
model:
  model_path: /path/to/Qwen3-0.6B-Base                                  # override: --model.model_path
  foundation:
    ttt_mode: true
    ttt_layers: [0, 4, 8, 12, 16, 20, 24]
    ttt_proj: true
    ttt_proj_init: diag_shared
    ttt_lr: 2.6
    ttt_chunk: 1024
    ttt_inner_opt: sgd
    ttt_norm_preserve: true
    ttt_target: hidden_states
    ttt_conv: false
    ttt_predict_mode: next

data:
  train_path: /path/to/hf-long-data-collections-sharded   # override: --data.train_path
  train_size: 20000000000
  dataloader_type: native
  datasets_type: iterable
  data_type: plaintext
  max_seq_len: 32768
  text_keys: text
  drop_last: true

train:
  output_dir: /path/to/output                                # override: --train.output_dir
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  global_batch_size: 64
  micro_batch_size: 8
  rmpad: false
  rmpad_with_pos_ids: false
  dyn_bsz: false
  dyn_bsz_margin: 0
  use_wandb: false
  max_steps: 100
  optimizer: adamw
  lr: 5.0e-6
  lr_warmup_ratio: 0.05
  lr_decay_style: cosine
  lr_decay_ratio: 0.90
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  init_device: meta
  ckpt_manager: dcp
  save_steps: 100
  save_hf_weights: true
  save_async: false
